<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${subject}">Powiadomienie - Czyzlowie</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333333;
        }
        .email-container {
            max-width: 600px;
            margin: 40px auto;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .header {
            background-color: #4a90e2;
            padding: 30px 20px;
            text-align: center;
        }
        .header img {
            max-height: 50px;
            /* Placeholder for logo */
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }
        .body {
            padding: 40px 30px;
        }
        .greeting {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .content {
            font-size: 16px;
            line-height: 1.6;
            color: #555555;
            margin-bottom: 30px;
        }
        .action-container {
            text-align: center;
            margin: 30px 0;
        }
        .action-button {
            display: inline-block;
            background-color: #4a90e2;
            color: #ffffff !important;
            text-decoration: none;
            padding: 14px 28px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
        }
        .code-box {
            background-color: #f8f9fa;
            border: 2px dashed #cbd5e1;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #334155;
            border-radius: 6px;
            margin: 20px 0;
        }
        .footer {
            background-color: #f8f9fa;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            border-top: 1px solid #e2e8f0;
        }
        .footer p {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="email-container">
        <!-- Logo i Nagłówek -->
        <div class="header">
            <!-- Tutaj można wstawić własne logo zmieniając src -->
            <img src="https://via.placeholder.com/150x50/4a90e2/ffffff?text=Czyzlowie+Logo" alt="Czyzlowie Logo" th:if="${logoUrl == null}">
            <img th:src="${logoUrl}" alt="Czyzlowie Logo" th:if="${logoUrl != null}" style="max-width: 200px;">
        </div>

        <!-- Główna zawartość -->
        <div class="body">
            <div class="greeting" th:text="${'Witaj ' + (name != null ? name : '') + ','}">Witaj,</div>

            <div class="content" th:utext="${message}">
                To jest domyślna wiadomość.
            </div>

            <!-- Opcjonalny kod (np. weryfikacyjny) -->
            <div class="code-box" th:if="${code != null}" th:text="${code}">
                123456
            </div>

            <!-- Opcjonalny przycisk akcji -->
            <div class="action-container" th:if="${actionUrl != null}">
                <a th:href="${actionUrl}" class="action-button" th:text="${actionText != null ? actionText : 'Kliknij tutaj'}">Akcja</a>
            </div>

            <div class="content" style="margin-top: 30px;">
                <p th:if="${disclaimer != null}" th:text="${disclaimer}" style="font-size: 14px; color: #718096;"></p>
                Jeśli nie prosiłeś/aś o tę wiadomość, możesz ją po prostu zignorować.
                <br><br>
                Pozdrawiamy,<br>
                Zespół Czyzlowie
            </div>
        </div>

        <!-- Stopka -->
        <div class="footer">
            <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> Czyzlowie. Wszelkie prawa zastrzeżone.</p>
            <p>Wiadomość wygenerowana automatycznie, prosimy na nią nie odpowiadać.</p>
        </div>
    </div>
</body>
</html>
